# Baseline security response headers, applied on every served response.
# (HSTS is intentionally NOT here — it belongs only on the HTTPS server block,
# added there once TLS is live, so we never send it over plain HTTP.)
#
# SAMEORIGIN (not DENY): the app embeds its OWN pages in iframes — the Document
# Designer gallery thumbnails, the builder's live preview, and the AI-import
# side-by-side. DENY blocks those (even same-origin); SAMEORIGIN still prevents
# cross-origin clickjacking. proxy.conf strips Django's per-view header so this
# single value governs every response.
add_header  X-Frame-Options         "SAMEORIGIN"                        always;
add_header  X-Content-Type-Options  "nosniff"                           always;
add_header  Referrer-Policy         "strict-origin-when-cross-origin"   always;
add_header  X-XSS-Protection        "1; mode=block"                     always;
add_header  Permissions-Policy      "geolocation=(self), microphone=(), camera=(self)" always;
