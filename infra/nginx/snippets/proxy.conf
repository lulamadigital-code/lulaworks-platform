# Shared proxy headers for every location that hits the Django upstream.
# X-Forwarded-Proto is what lets Django (SECURE_PROXY_SSL_HEADER) know the
# original request was HTTPS even though nginx→gunicorn is plain HTTP.

# Re-resolve the `web` app container per request via Docker's embedded DNS,
# instead of caching its IP once at startup (which a static `upstream` block
# does — the cause of the 502 after every redeploy). This makes nginx follow
# `web` to its new IP within ~10s of a recreate, with NO reload — the same trick
# snippets/ws.conf already uses for the ws service. Consumed by each location's
# `proxy_pass http://$app;`.
resolver 127.0.0.11 valid=10s ipv6=off;
set $app web:8000;

proxy_set_header  Host               $host;
proxy_set_header  X-Real-IP          $remote_addr;
proxy_set_header  X-Forwarded-For    $proxy_add_x_forwarded_for;
proxy_set_header  X-Forwarded-Proto  $scheme;
proxy_set_header  X-Forwarded-Host   $host;
proxy_redirect    off;
proxy_http_version 1.1;
proxy_set_header  Connection         "";
proxy_connect_timeout  10s;
proxy_read_timeout     60s;
proxy_send_timeout     60s;

# Django (SecurityMiddleware) already sets these on dynamic responses. Hide the
# upstream copies so the server-level add_header in this proxy is the single,
# authoritative source — no duplicated or conflicting security headers.
proxy_hide_header  X-Frame-Options;
proxy_hide_header  X-Content-Type-Options;
proxy_hide_header  Referrer-Policy;
