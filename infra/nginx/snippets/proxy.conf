# Shared proxy headers for every location that hits the Django upstream.
# X-Forwarded-Proto is what lets Django (SECURE_PROXY_SSL_HEADER) know the
# original request was HTTPS even though nginx→gunicorn is plain HTTP.
proxy_set_header  Host               $host;
proxy_set_header  X-Real-IP          $remote_addr;
proxy_set_header  X-Forwarded-For    $proxy_add_x_forwarded_for;
proxy_set_header  X-Forwarded-Proto  $scheme;
proxy_set_header  X-Forwarded-Host   $host;
proxy_redirect    off;
proxy_http_version 1.1;
proxy_set_header  Connection         "";
proxy_connect_timeout  10s;
proxy_read_timeout     60s;
proxy_send_timeout     60s;

# Django (SecurityMiddleware) already sets these on dynamic responses. Hide the
# upstream copies so the server-level add_header in this proxy is the single,
# authoritative source — no duplicated or conflicting security headers.
proxy_hide_header  X-Frame-Options;
proxy_hide_header  X-Content-Type-Options;
proxy_hide_header  Referrer-Policy;
