# WebSocket proxy → the Daphne/ASGI service (real-time support chat).
# Include inside a `location /ws/ { ... }` block.
#
# `ws` is resolved LAZILY at request time via Docker's embedded DNS (127.0.0.11)
# and a variable proxy_pass — NOT at config-parse time. So `nginx -t` and reloads
# never fail on upstream resolution, and a momentarily-down ws service only 502s
# /ws/ (the rest of the site is unaffected) instead of blocking nginx.
resolver 127.0.0.11 valid=10s ipv6=off;
set $ws_backend ws:8001;
proxy_pass http://$ws_backend;
proxy_http_version 1.1;
proxy_set_header Upgrade            $http_upgrade;
proxy_set_header Connection         $connection_upgrade;
proxy_set_header Host               $host;
proxy_set_header X-Real-IP          $remote_addr;
proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto  $scheme;
proxy_read_timeout  3600s;   # keep long-lived sockets open
proxy_send_timeout  3600s;
