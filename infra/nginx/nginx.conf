# LulaWorks — nginx reverse proxy (production front door).
# Terminates the public connection, serves static/media directly, and proxies
# everything dynamic to the gunicorn/Django upstream over the internal network.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Real client IP (forwarded by DO/AWS load balancers) + upstream response time.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time uct="$upstream_connect_time" '
                      'urt="$upstream_response_time"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;                  # never advertise the nginx version

    # Request size ceiling — large enough for scanned POs/receipts, small enough
    # to blunt oversized-upload abuse. Django enforces its own limit too.
    client_max_body_size  25m;
    client_body_timeout   30s;
    client_header_timeout 30s;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_types        text/plain text/css application/json application/javascript
                      application/xml text/xml image/svg+xml application/wasm
                      font/woff2;

    # ── Rate-limit zones (applied per-location in the server block) ───────────
    # General traffic gets a generous steady rate; auth endpoints are throttled
    # hard to slow credential-stuffing. Bursts absorb legitimate spikes.
    limit_req_zone  $binary_remote_addr  zone=general:10m  rate=30r/s;
    limit_req_zone  $binary_remote_addr  zone=api:10m      rate=10r/s;
    limit_req_zone  $binary_remote_addr  zone=auth:10m     rate=20r/m;
    limit_req_status  429;

    # gunicorn upstream on the internal docker network (never published to host).
    upstream django {
        server web:8000;
        keepalive 32;
    }

    # WebSocket upgrade: "upgrade" when the client asks, else "close". (The ws
    # backend is proxied via a variable in snippets/ws.conf with a resolver, so no
    # `upstream` block — that avoids nginx failing to load when ws is briefly down.)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
