# LulaWorks — HTTP server block (works immediately on a fresh droplet).
#
# This serves the whole app over HTTP so `docker compose up` is functional
# before any certificate exists. To go HTTPS: obtain a cert (certbot writes to
# the acme-challenge path below), then enable infra/nginx/conf.d/ssl.conf.example
# (rename to ssl.conf) and reload nginx. See docs/DEPLOYMENT.md.

server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;

    include /etc/nginx/snippets/security-headers.conf;

    # ── Let's Encrypt HTTP-01 challenge (kept reachable over plain HTTP) ──────
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # ── Static assets (collected by the web container into a shared volume) ───
    # A location with its own add_header does NOT inherit server-level headers,
    # so the security snippet is re-included here. One Cache-Control only (no
    # `expires`, which would emit a second, conflicting Cache-Control).
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # ── User-uploaded media (logos, scanned POs/receipts) ────────────────────
    # NOTE: migrates to DigitalOcean Spaces / S3 later; nginx stops serving it
    # then and this block is removed (see settings STORAGES).
    location /media/ {
        alias /app/media/;
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
    }

    # ── Health probe: no rate limit, no access log (keeps LB checks quiet) ────
    location = /health/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://django;
        access_log off;
    }

    # ── Auth endpoints: throttled hard against credential stuffing ───────────
    location = /login/ {
        limit_req zone=auth burst=10 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://django;
    }
    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://django;
    }

    # ── JSON API (Flutter field app) ────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=30 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://django;
    }

    # ── Real-time support chat (WebSockets) → Daphne/ASGI ───────────────────
    location /ws/ { include /etc/nginx/snippets/ws.conf; }

    # ── Manager web + admin + everything else ───────────────────────────────
    location / {
        limit_req zone=general burst=50 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://django;
    }
}
