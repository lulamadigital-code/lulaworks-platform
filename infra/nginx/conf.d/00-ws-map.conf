# WebSocket upgrade map for the real-time support chat. Loaded first (00-) so
# $connection_upgrade is defined before snippets/ws.conf uses it. This is an ACTIVE
# config (not .example): it's a bare http-context `map`, harmless when unused, and
# nginx loads every conf.d/*.conf inside `http {}`.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}
