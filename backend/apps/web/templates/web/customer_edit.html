{% extends "web/base.html" %}
{% block title %}Edit {{ customer.display_name }}{% endblock %}
{% block content %}
<p class="sub"><a href="{% url 'web:customer_detail' customer.id %}">← {{ customer.display_name }}</a></p>
<h1 style="margin:0 0 16px;">Edit customer</h1>

<form method="post">{% csrf_token %}
  <div class="card">
    <strong>Identity</strong>
    <div class="two" style="margin-top:10px;">
      <div><label>Registered name</label>
        <input type="text" name="name" value="{{ customer.name }}" required></div>
      <div><label>Trading name</label>
        <input type="text" name="trading_name" value="{{ customer.trading_name }}"></div>
      <div><label>Registration no.</label>
        <input type="text" name="registration_no" value="{{ customer.registration_no }}"></div>
      <div><label>VAT no.</label>
        <input type="text" name="vat_no" value="{{ customer.vat_no }}"></div>
      <div><label>Tax no.</label>
        <input type="text" name="tax_no" value="{{ customer.tax_no }}"></div>
      <div><label>Industry</label>
        <input type="text" name="industry" value="{{ customer.industry }}"></div>
      <div><label>Status</label>
        <select name="status">
          {% for v, l in statuses %}<option value="{{ v }}" {% if v == customer.status %}selected{% endif %}>{{ l }}</option>{% endfor %}
        </select></div>
    </div>
  </div>

  <div class="card">
    <strong>Address</strong>
    <div class="two" style="margin-top:10px;">
      <div><label>Physical address</label>
        <input type="text" name="physical_address" value="{{ customer.physical_address }}"></div>
      <div><label>Postal address</label>
        <input type="text" name="postal_address" value="{{ customer.postal_address }}"></div>
      <div><label>City</label><input type="text" name="city" value="{{ customer.city }}"></div>
      <div><label>Province</label><input type="text" name="province" value="{{ customer.province }}"></div>
      <div><label>Postal code</label><input type="text" name="postal_code" value="{{ customer.postal_code }}"></div>
    </div>
  </div>

  <div class="card">
    <strong>Contact &amp; trading</strong>
    <div class="two" style="margin-top:10px;">
      <div><label>Telephone</label><input type="text" name="telephone" value="{{ customer.telephone }}"></div>
      <div><label>Mobile</label><input type="text" name="mobile" value="{{ customer.mobile }}"></div>
      <div><label>Email</label><input type="email" name="email" value="{{ customer.email }}"></div>
      <div><label>Our vendor number with them</label>
        <input type="text" name="vendor_number" value="{{ customer.vendor_number }}"
               placeholder="e.g. TRL0086"></div>
      <div><label>Vendor portal</label>
        <input type="text" name="vendor_portal" value="{{ customer.vendor_portal }}"
               placeholder="Coupa, Ariba…"></div>
      <div><label>Payment terms (days)</label>
        <input type="number" name="payment_terms_days" value="{{ customer.payment_terms_days }}"></div>
      <div><label>Payment terms note</label>
        <input type="text" name="payment_terms_note" value="{{ customer.payment_terms_note }}"></div>
      <div><label>Vendor note</label>
        <input type="text" name="vendor_note" value="{{ customer.vendor_note }}"></div>
    </div>
  </div>

  <div class="row" style="gap:10px;margin-top:4px;">
    <button class="btn" type="submit">Save changes</button>
    <a class="btn ghost" href="{% url 'web:customer_detail' customer.id %}">Cancel</a>
  </div>
</form>
{% endblock %}
