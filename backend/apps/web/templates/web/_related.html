{# Cross-module Related Records panel. Pass `related` = related_records(obj). #}
{% if related %}
<div class="card" style="margin-top:16px;">
  <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:10px;">Related records</div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;">
    {% for sec in related %}
    <div>
      <div class="muted" style="font-size:12px;font-weight:600;margin-bottom:5px;">{{ sec.title }}</div>
      {% for it in sec.items %}
      <a href="{{ it.url }}" style="display:block;text-decoration:none;color:var(--ink);padding:6px 8px;border:1px solid var(--line);border-radius:8px;margin-bottom:5px;">
        <span style="font-weight:600;font-size:13.5px;">{{ it.label }}</span>
        <span class="muted" style="font-size:11.5px;display:block;">{{ it.sub }}</span>
      </a>
      {% endfor %}
    </div>
    {% endfor %}
  </div>
</div>
{% endif %}
