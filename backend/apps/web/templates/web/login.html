{% extends "web/base.html" %}
{% load static %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div style="max-width:380px; margin:8vh auto;">
  <div style="text-align:center; margin-bottom:20px;">
    <div class="login-logo">
      {% if has_logo %}<img src="{% static logo_static %}" class="brand-img" alt="Lulaworks">
      {% else %}{% include "web/_mark.svg" %}<span class="word">lulaworks</span>{% endif %}
    </div>
    <div class="muted" style="margin-top:6px;">Manager dashboards</div>
  </div>
  <div class="card">
    <form method="post" action="{% url 'web:login' %}">
      {% csrf_token %}
      <label>Email</label>
      <input type="email" name="email" autocomplete="username" autofocus required>
      <label>Password</label>
      <input type="password" name="password" autocomplete="current-password" required>
      <button class="btn" style="width:100%; margin-top:20px;" type="submit">Sign in</button>
    </form>
    <p style="margin-top:14px;text-align:center;font-size:13px;">
      <a href="{% url 'web:password_reset_request' %}">Forgot your password?</a></p>
  </div>
</div>
{% endblock %}
