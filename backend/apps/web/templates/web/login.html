{% extends "web/base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div style="max-width:380px; margin:8vh auto;">
  <div style="text-align:center; margin-bottom:20px;">
    <div class="login-logo">{% include "web/_mark.svg" %}<span class="word">lulaworks</span></div>
    <div class="muted" style="margin-top:6px;">Manager dashboards</div>
  </div>
  <div class="card">
    <form method="post" action="{% url 'web:login' %}">
      {% csrf_token %}
      <label>Email</label>
      <input type="email" name="email" autocomplete="username" autofocus required>
      <label>Password</label>
      <input type="password" name="password" autocomplete="current-password" required>
      <button class="btn" style="width:100%; margin-top:20px;" type="submit">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
