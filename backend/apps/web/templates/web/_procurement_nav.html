{% comment %}Procurement section sub-navigation. Active tab is the current url name.{% endcomment %}
{% with u=request.resolver_match.url_name %}
<div class="filterbar" style="gap:6px;margin-bottom:18px;flex-wrap:wrap;">
  <a class="btn {% if u == 'procurement' %}{% else %}ghost{% endif %}" href="{% url 'web:procurement' %}">Overview</a>
  <a class="btn {% if u == 'suppliers' or u == 'supplier_detail' %}{% else %}ghost{% endif %}" href="{% url 'web:suppliers' %}">Suppliers</a>
  <a class="btn {% if u == 'products' or u == 'product_detail' %}{% else %}ghost{% endif %}" href="{% url 'web:products' %}">Products</a>
  <a class="btn {% if u == 'requests' or u == 'request_new' or u == 'request_detail' %}{% else %}ghost{% endif %}" href="{% url 'web:requests' %}">Requests</a>
  <a class="btn {% if u == 'purchase_orders' or u == 'po_detail' %}{% else %}ghost{% endif %}" href="{% url 'web:purchase_orders' %}">Purchase orders</a>
  <a class="btn {% if u == 'procurement_prices' %}{% else %}ghost{% endif %}" href="{% url 'web:procurement_prices' %}">Price history</a>
</div>
{% endwith %}
